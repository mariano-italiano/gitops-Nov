apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: test-nginx-web
    zone: az1
  name: test-nginx-web
spec:
  replicas: 5
  selector:
    matchLabels:
      app: test-nginx-web
  strategy: {}
  template:
    metadata:
      labels:
        app: test-nginx-web
    spec:
      containers:
      - image: nginx
        name: nginx
