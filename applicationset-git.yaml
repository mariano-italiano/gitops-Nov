apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-dirs
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/mariano-italiano/gitops.git
        revision: HEAD
        directories:
          - path: apps/*
  template:
    metadata:
      name: 'dir-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/mariano-italiano/gitops.git
        targetRevision: HEAD
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'dir-{{.path.basename}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
